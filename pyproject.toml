[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nalr"
version = "0.1.0"
description = "NeuroAnthropic Living Runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0,<2.0",
  "fastapi>=0.115,<1.0",
  "openai>=1.0,<2.0",
  "pyyaml>=6.0,<7.0",
  "typer>=0.12,<1.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
]

[project.scripts]
alive = "nalr.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
