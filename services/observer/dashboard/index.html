<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NALR Observer</title>
    <style>
      :root {
        --bg: #efe6d6;
        --ink: #1f2927;
        --accent: #a54135;
        --accent-soft: #dbbba1;
        --card: #fff8ef;
        --line: rgba(31, 41, 39, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Iowan Old Style", "Palatino Linotype", serif;
        background:
          radial-gradient(circle at top left, rgba(255,255,255,0.9), transparent 25%),
          radial-gradient(circle at bottom right, rgba(165,65,53,0.08), transparent 25%),
          var(--bg);
        color: var(--ink);
      }
      main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 48px 24px 96px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.5rem, 7vw, 4.5rem);
      }
      p {
        line-height: 1.6;
      }
      .intro {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 20px;
        margin-bottom: 24px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 20px;
        box-shadow: 0 24px 60px rgba(31, 41, 39, 0.08);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      .stat {
        padding: 14px;
        border-radius: 16px;
        background: rgba(219, 187, 161, 0.18);
      }
      .stat strong {
        display: block;
        font-size: 1.8rem;
      }
      .bars { display: grid; gap: 10px; }
      .bar-row { display: grid; gap: 4px; }
      .bar {
        height: 10px;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accent), #d37b5a);
      }
      .table {
        display: grid;
        gap: 8px;
      }
      .table-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--line);
      }
      code {
        color: var(--accent);
      }
      @media (max-width: 820px) {
        .intro, .grid, .stats { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="intro">
        <div class="card">
          <h1>NALR Observer</h1>
          <p>Read-only runtime diagnostics for conflict, replay, contribution heatmaps, and longrun state drift.</p>
          <p><code>/metrics/summary</code> · <code>/metrics/timeline</code> · <code>/metrics/heatmap</code> · <code>/replay/{round_id}</code></p>
        </div>
        <div class="card stats" id="stats"></div>
      </section>
      <section class="grid">
        <div class="card">
          <h2>Action Heat</h2>
          <div class="bars" id="actions"></div>
        </div>
        <div class="card">
          <h2>Timeline</h2>
          <div class="table" id="timeline"></div>
        </div>
        <div class="card">
          <h2>Contribution Matrix</h2>
          <div class="table" id="heatmap"></div>
        </div>
        <div class="card">
          <h2>Latest Replay</h2>
          <div class="table" id="replay"></div>
        </div>
      </section>
    </main>
    <script>
      async function loadJson(path) {
        const response = await fetch(path);
        return response.json();
      }

      function renderStats(summary) {
        const stats = document.getElementById("stats");
        stats.innerHTML = [
          ["Rounds", summary.total_rounds],
          ["Safe Mode", summary.safe_mode_rounds],
          ["Avg Budget", summary.average_budget_remaining],
        ].map(([label, value]) => `<div class="stat"><span>${label}</span><strong>${value}</strong></div>`).join("");
      }

      function renderActions(summary) {
        const root = document.getElementById("actions");
        const max = Math.max(...Object.values(summary.sampled_actions || { respond: 1 }));
        root.innerHTML = Object.entries(summary.sampled_actions || {}).map(([action, count]) => `
          <div class="bar-row">
            <div>${action} · ${count}</div>
            <div class="bar" style="width:${(count / max) * 100}%"></div>
          </div>
        `).join("");
      }

      function renderTimeline(timeline) {
        const root = document.getElementById("timeline");
        root.innerHTML = (timeline.rounds || []).slice(-8).reverse().map((item) => `
          <div class="table-row">
            <div>#${item.round_id} ${item.sampled_action}</div>
            <div>conflict ${item.conflict_score} · budget ${item.budget_remaining}</div>
          </div>
        `).join("");
      }

      function renderHeatmap(heatmap) {
        const root = document.getElementById("heatmap");
        root.innerHTML = Object.entries(heatmap.matrix || {}).map(([agent, values]) => `
          <div class="table-row">
            <div>${agent}</div>
            <div>${Object.entries(values).map(([action, count]) => `${action}:${count}`).join(" · ")}</div>
          </div>
        `).join("");
      }

      function renderReplay(replay) {
        const root = document.getElementById("replay");
        root.innerHTML = `
          <div class="table-row"><div>Original</div><div>${replay.original_action || "-"}</div></div>
          <div class="table-row"><div>Replayed</div><div>${replay.replayed_action || "-"}</div></div>
          ${(replay.ablations || []).map((item) => `<div class="table-row"><div>${item.agent}</div><div>${item.action} (${item.delta})</div></div>`).join("")}
        `;
      }

      Promise.all([
        loadJson("/metrics/summary"),
        loadJson("/metrics/timeline"),
        loadJson("/metrics/heatmap"),
        loadJson("/replay/1?seed=7").catch(() => ({ ablations: [] })),
      ]).then(([summary, timeline, heatmap, replay]) => {
        renderStats(summary);
        renderActions(summary);
        renderTimeline(timeline);
        renderHeatmap(heatmap);
        renderReplay(replay);
      });
    </script>
  </body>
</html>
