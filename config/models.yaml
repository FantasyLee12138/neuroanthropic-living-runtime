module_model_bindings:
  cognitive_packet: medium_model
  deliberation: large_model
  tool_planner: medium_model
  deep_renderer: large_model
  consolidation_summarizer: small_model
route_policies:
  chat_micro:
    latency_budget_ms: 250
  chat_fast:
    latency_budget_ms: 700
  chat_standard:
    latency_budget_ms: 1200
  chat_deep:
    latency_budget_ms: 2200
activation_thresholds:
  salience_high: 0.72
  uncertainty_high: 0.58
  conflict_high: 0.62
  tool_need_high: 0.5
memory_tier_policy:
  chat_fast:
    - hot
  chat_standard_default:
    - hot
  chat_standard_on_cue:
    - hot
    - warm
  chat_deep:
    - hot
    - warm
    - cold
consolidation_policy:
  enabled: true
  queue: dream_sidecar
  write_inline:
    - state_patch
    - obligations
    - habit_delta
    - relation_delta
    - event_index
  write_deferred:
    - long_term_summarization
    - memory_consolidation
    - topic_clustering
    - compaction
    - replay
perspective:
  enabled: true
  risk_threshold: 0.33
models:
  provider: doubao_ark
  base_url: https://ark.cn-beijing.volces.com/api/v3
  primary_model: doubao-seed-2-0-pro-260215
  fast_model: doubao-seed-2-0-pro-260215
  timeout_seconds: 20
  retries: 1
  max_output_tokens: 512
initiative_trigger:
  idle_seconds_threshold: 300
  vitality_threshold: 0.8
  relation_strength_threshold: 0.6
  habit_strength_threshold: 0.45
  proposal_posterior_threshold: 0.7
  hourly_limit: 0
  cooldown_seconds: 600
  require_memory_backing: true
  auto_send_enabled: true
monologue_stream:
  generator_mode: model
  hidden_by_default: true
  bootstrap_seconds: 6
  min_interval_ms: 120
  max_interval_ms: 900
  min_fragments_per_pulse: 1
  max_fragments_per_pulse: 3
  default_show_limit: 12
